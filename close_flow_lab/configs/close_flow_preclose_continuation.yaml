status: untested
family: momentum
horizon: intraday
requires_engine: intraday_1m
kind: standalone
source:
  branch: CLOSE_FLOW_LAB (OrenHarari/Close-Flow-Lab)
  path: close_flow_lab/scripts/phase2_postmortem3.py
